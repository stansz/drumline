<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drumline</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span id="money">$100</span>
        <span id="lives">20 lives</span>
        <span id="wave">Wave 0/30</span>
        <button id="theme" type="button" aria-label="Change music theme">♪ Neon</button>
        <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" title="Volume" />
      </header>
      <main id="stage">
        <canvas id="game" width="896" height="448" aria-label="Drumline game board"></canvas>
      </main>
      <p id="info"></p>
      <div id="controls">
        <button id="tool-kick" type="button"><span class="glyph kick">●</span> Kick <small class="cost"></small></button>
        <button id="tool-hat" type="button"><span class="glyph hat">▲</span> Hat <small class="cost"></small></button>
        <button id="tool-synth" type="button"><span class="glyph synth">◆</span> Synth <small class="cost"></small></button>
        <button id="tool-sell" type="button">Sell</button>
        <button id="start-wave" type="button">Start wave</button>
        <button id="auto-wave" type="button">Auto: On</button>
        <button id="speed" type="button">120 BPM</button>
        <button id="mute" type="button">Mute</button>
        <button id="restart" type="button">Restart</button>
      </div>
    </div>
    <div id="overlay">
      <div id="overlay-text">Choose a difficulty</div>
      <div id="mode-buttons">
        <button id="mode-easy" type="button">Easy</button>
        <button id="mode-hard" type="button">Hard</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
