<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drumline</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span id="money">$100</span>
        <span id="lives">20 lives</span>
        <span id="wave">Wave 0/5</span>
        <button id="theme" type="button" aria-label="Change music theme">♪ Neon</button>
      </header>
      <main id="stage">
        <canvas id="game" width="896" height="448" aria-label="Drumline game board"></canvas>
      </main>
      <p id="info"></p>
      <div id="controls">
        <button id="tool-kick" type="button"><span class="glyph kick">●</span> Kick <small class="cost"></small></button>
        <button id="tool-hat" type="button"><span class="glyph hat">▲</span> Hat <small class="cost"></small></button>
        <button id="tool-synth" type="button"><span class="glyph synth">◆</span> Synth <small class="cost"></small></button>
        <button id="tool-sell" type="button">Sell</button>
        <button id="start-wave" type="button">Start wave</button>
        <button id="fast" type="button">2×</button>
        <button id="mute" type="button">Mute</button>
        <button id="restart" type="button">Restart</button>
      </div>
    </div>
    <div id="overlay">
      <div id="overlay-text">Click to start</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
