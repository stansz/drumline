name: Rebuild the upgrades page

# Pages only deploys from main, so a push to upgrades reruns the main deploy instead.

on:
  push:
    branches:
      - upgrades

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f source=upgrades
        env:
          GH_TOKEN: ${{ github.token }}
